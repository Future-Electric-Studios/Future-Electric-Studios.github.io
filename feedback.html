<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Future Electric Studios</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-main: #ffffff;
            --accent: #007aff;
            --nav-bg: rgba(10, 10, 10, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #333;
            z-index: 1000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 60px;
        }

        .logo { 
            font-weight: 900; 
            font-size: 1.2rem; 
            text-decoration: none; 
            color: white; 
            letter-spacing: -0.5px;
        }

        .back-link {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid #333;
            padding: 5px 15px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .back-link:hover {
            background: #222;
        }

        /* Form Wrapper with Glow Effect */
        .form-wrapper {
            margin-top: 100px;
            width: 95%;
            max-width: 850px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03); 
            border-radius: 28px;
            border: 1px solid #333;
            box-shadow: 0 0 50px rgba(0, 122, 255, 0.15); /* Soft blue studio glow */
            margin-bottom: 50px;
            box-sizing: border-box;
        }

        iframe {
            width: 100%;
            height: 800px;
            border: none;
            border-radius: 20px; /* Rounds the white corners of the form */
            filter: contrast(102%) brightness(95%); /* Softens the harsh light mode */
        }

        /* Mobile Adjustments for Pixel 7 and others */
        @media (max-width: 600px) {
            nav {
                padding: 10px 0;
                height: auto;
                flex-direction: column;
            }
            .form-wrapper {
                margin-top: 120px;
                padding: 10px;
                width: 98%;
            }
            iframe {
                height: 700px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo">FUTURE ELECTRIC STUDIOS</a>
        <a href="/" class="back-link">← Back to Home</a>
    </nav>

    <div class="form-wrapper">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScaV5Y7HWFrFsqlwe-hmL9-f58DIaMfKdW5J5b230vKFKGP_w/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    </div>

</body>
</html>
